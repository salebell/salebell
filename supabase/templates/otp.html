<!doctype html>
<html lang="en">
  <body style="margin:0;padding:0;background:#f6f7f9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#111827;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f6f7f9;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background:#ffffff;border-radius:12px;padding:32px;">
            <tr>
              <td style="font-size:18px;font-weight:700;letter-spacing:-0.01em;">Salebell</td>
            </tr>
            <tr>
              <td style="padding-top:24px;font-size:15px;line-height:1.5;">Your sign-in code:</td>
            </tr>
            <tr>
              <td style="padding:12px 0 20px;font-size:34px;font-weight:700;letter-spacing:0.3em;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;">{{ .Token }}</td>
            </tr>
            <tr>
              <td style="font-size:14px;line-height:1.5;color:#4b5563;">Enter it in Salebell on the web or in the iPhone app. It expires in 15 minutes.<br><br>If you didn't ask for this code, you can ignore this email.</td>
            </tr>
          </table>
          <p style="font-size:12px;color:#9ca3af;margin-top:16px;">Salebell · real-time alerts for in-app purchases and subscriptions</p>
        </td>
      </tr>
    </table>
  </body>
</html>
