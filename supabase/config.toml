# Only the settings Salebell depends on; `supabase init` defaults apply otherwise.
# Managed-cloud Auth is configured by scripts/setup.sh, not `supabase config push`.
# Local Supabase project name.
project_id = "salebell"

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]

[auth.email]
# The email provider covers both the one-time code and email + password sign-in; keep both
# enabled (password sign-in is used for App Store review and test accounts).
enable_signup = true
# One-time 6-digit code (no magic-link click needed; works the same on web and iOS).
otp_length = 6
# Seconds: codes are valid for 15 minutes.
otp_expiry = 900

# signInWithOtp sends "confirmation" to new users and "magic_link" to returning ones;
# both show the code.
[auth.email.template.confirmation]
subject = "Your Salebell sign-in code"
content_path = "./supabase/templates/otp.html"

[auth.email.template.magic_link]
subject = "Your Salebell sign-in code"
content_path = "./supabase/templates/otp.html"

[functions.apple-webhook]
# Apple authenticates with its own signed payload, not a Supabase JWT.
verify_jwt = false

[functions.stripe-webhook]
# Stripe authenticates with the Stripe-Signature HMAC.
verify_jwt = false

[functions.google-webhook]
# Pub/Sub authenticates with a Google-signed OIDC token verified by the handler.
verify_jwt = false

[functions.google-connect]
# Verify the bearer token through Auth.getUser in the handler; this supports
# modern signing keys as well as legacy JWTs. Workspace checks run in the RPCs.
verify_jwt = false

[functions.fx-refresh]
# Called by pg_cron without credentials; idempotent and a no-op within 6 hours.
verify_jwt = false

[functions.test-alert]
# The handler verifies the user with Auth.getUser before any privileged work.
verify_jwt = false

[functions.apple-test]
verify_jwt = false

[functions.apple-connect]
# Auth.getUser verifies the caller; workspace owner/admin access is required.
verify_jwt = false

[functions.apple-credentials]
# Auth.getUser verifies the caller; saved-key management requires owner/admin access.
verify_jwt = false

[functions.billing]
verify_jwt = true

[functions.delete-account]
# The handler verifies the user with Auth.getUser before any privileged work.
verify_jwt = false
