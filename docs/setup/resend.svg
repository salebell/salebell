t-weight="400" fill="#6b7280" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Copy it. setup.sh asks for it</text><text x="470" y="296" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">along with your sender address,</text><text x="470" y="314" font-size="12" font-weight="400" fill="#6b7280" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">e.g. hello@yourdomain.com.</text></svg>