<svg xmlns="http://www.w3.org/2000/svg" width="760" height="268" viewBox="0 0 760 268" role="img" aria-label="Sign-in email before the fix (localhost link) and after (6-digit code)"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9ca3af"/></marker></defs><rect x="0" y="0" width="760" height="268" rx="14" fill="#f6f7f9" stroke="none" stroke-width="1" /><text x="24" y="34" font-size="14" font-weight="700" fill="#b91c1c" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Before: link to localhost</text><rect x="24" y="48" width="338" height="196" rx="12" fill="#fff" stroke="#e5e7eb" stroke-width="1" /><text x="44" y="80" font-size="15" font-weight="700" fill="#111827" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Magic Link</text><text x="44" y="110" font-size="13" font-weight="400" fill="#374151" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Follow this link to login:</text><text x="44" y="134" font-size="13" font-weight="600" fill="#2563eb" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Log In</text><rect x="44" y="150" width="298" height="28" rx="6" fill="#fef2f2" stroke="#fecaca" stroke-width="1" /><text x="54" y="168" font-size="11.5" font-weight="400" fill="#b91c1c" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">http://localhost:3000/#access_token=…</text><text x="44" y="204" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Opens a page that doesn&#x27;t exist.</text><circle cx="338" cy="74" r="12" fill="#fee2e2"/><text x="338" y="79" font-size="14" font-weight="700" fill="#b91c1c" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">✕</text><text x="398" y="34" font-size="14" font-weight="700" fill="#15803d" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">After: a 6-digit code</text><rect x="398" y="48" width="338" height="196" rx="12" fill="#fff" stroke="#e5e7eb" stroke-width="1" /><text x="418" y="80" font-size="15" font-weight="700" fill="#111827" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Salebell</text><text x="418" y="110" font-size="13" font-weight="400" fill="#374151" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Your sign-in code:</text><text x="418" y="156" font-size="34" font-weight="700" fill="#111827" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">4 8 2 9 1 3</text><text x="418" y="190" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Type it into Salebell on the web or iPhone.</text><text x="418" y="210" font-size="12" font-weight="400" fill="#4b5563" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">Expires in 15 minutes.</text><circle cx="712" cy="74" r="12" fill="#dcfce7"/><text x="712" y="79" font-size="14" font-weight="700" fill="#15803d" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">✓</text></svg>